packages:
  - donut-sync
  - cloudflare-sync-worker

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@nestjs/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - sharp
  - sqlite3
  - unrs-resolver
  - workerd

# Dependency pins. Moved from package.json#pnpm.overrides — pnpm 11
# no longer reads that field; settings live here now.
overrides:
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  postcss@<8.5.18: '>=8.5.18'
  fast-xml-parser@<5.7.0: '>=5.7.2'
  fast-uri@<3.1.5: '>=3.1.5 <4'
  fast-xml-builder@<1.2.0: '>=1.2.0'
  qs@>=6.11.1 <6.15.2: '>=6.15.2'
  js-cookie@<3.0.7: '>=3.0.7'
  nanoid@<3.3.18: '>=3.3.18 <4'
  fast-uri@>=4.0.0 <4.1.1: '>=4.1.1 <5'
  multer@>=2.0.0 <2.2.0: '>=2.2.0'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  js-yaml@<3.15.1: '>=3.15.1 <4'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1 <5'
  '@babel/core@<7.29.6': '>=7.29.6 <8'
  sharp@<0.35.0: '>=0.35.0 <0.36'
  # Keep the API used by plugins on the Rust crate's minor version.
  '@tauri-apps/api': '~2.12.1'
  # Fixes the brace-expansion advisories for every major still in the tree;
  # patches/brace-expansion@5.0.12.patch keeps the older CommonJS imports working.
  brace-expansion@<5.0.12: 5.0.12
  # js-yaml 3 pulls sprintf-js through argparse 1; no sprintf-js release fixes
  # GHSA-hp3w-g68c-fv3c. load-nyc-config only calls load(), which js-yaml 4 keeps.
  '@istanbuljs/load-nyc-config>js-yaml': ^4.3.2

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
