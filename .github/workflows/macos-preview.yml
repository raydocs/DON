name: macOS Preview

on:
  pull_request:
    paths:
      - ".github/workflows/macos-preview.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build DMG (${{ matrix.arch }})
    if: >-
      github.repository == 'raydocs/DON' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout the requested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record preview provenance
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TAG=preview-${SOURCE_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f #master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Verify the native toolchain and architecture checker
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
          lipo "$(rustup which rustc)" -verify_arch "$ARCH"

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2
        with:
          workspaces: "src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The existing build hook builds donut-proxy, verifies/downloads Xray,
      # and exports the frontend. No release action or signing secrets are used.
      # Both runners are native, so share the hook's target/release directory
      # instead of compiling dependencies again in target/<triple>/release.
      - name: Build the preview app and DMG
        run: pnpm tauri build --bundles app,dmg --ci

      - name: Verify the mounted installer and collect downloads
        run: |
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          test "$(find "$DMG_DIR" -name '*.dmg' | wc -l | tr -d ' ')" = 1
          DMG=$(find "$DMG_DIR" -name '*.dmg')
          hdiutil verify "$DMG"

          MOUNT=$(mktemp -d "$RUNNER_TEMP/don-preview.XXXXXX")
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          APP="$MOUNT/Don.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.donbrowser
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          for BIN in "$EXECUTABLE" donut-proxy xray; do
            test -x "$APP/Contents/MacOS/$BIN"
            lipo "$APP/Contents/MacOS/$BIN" -verify_arch "$ARCH"
          done
          test -s "$APP/Contents/Resources/licenses/Xray-core-LICENSE.txt"
          DONUTBROWSER_DATA_ROOT="$RUNNER_TEMP/don-preview-data" \
            "$APP/Contents/MacOS/donut-proxy" --version | grep -F "$BUILD_TAG"
          "$APP/Contents/MacOS/xray" version

          mkdir -p macos-preview
          cp "$DMG" "macos-preview/Don-$BUILD_TAG-$ARCH.dmg"
          {
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_SHA"
            echo "Build: $BUILD_TAG"
            echo "Target: $TARGET"
            echo "Signing: ad-hoc; not Apple notarized; preview only"
            echo "Checks: DMG integrity, mounted app signature, architectures, sidecar versions"
            echo "Not tested: GUI launch, Wayfern, real model inference, production data migration"
          } > macos-preview/BUILD.txt
          (cd macos-preview && shasum -a 256 ./*.dmg > SHA256SUMS)
          cat macos-preview/BUILD.txt macos-preview/SHA256SUMS

      - name: Upload the installer, provenance and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: Don-macOS-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: macos-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Keep an unverified DMG for failure diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: Don-macOS-${{ matrix.arch }}-${{ env.SOURCE_SHA }}-unverified
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 1
