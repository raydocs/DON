name = "don-sync-worker"
main = "src/index.ts"
account_id = "63fb9ee0f754bbe960a080bff02a22fe"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Bucket Binding for sync object blobs & chunks
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "don-sync-bucket"

# Cloudflare D1 Database Binding for selective sync metadata & user permissions
[[d1_databases]]
binding = "DB"
database_name = "don-sync-db"
database_id = "91984417-cc14-4392-a96f-595143698b1c"

[vars]
# Secrets MUST be set via `wrangler secret put`, NOT as plaintext [vars].
# Cloudflare docs: "Do not use vars to store sensitive information... Use secrets instead."
#   npx wrangler secret put SYNC_TOKEN      -> master auth bearer token (authenticateRequest)
#   npx wrangler secret put SIGNING_SECRET   -> HMAC key for /raw/* transfer URLs (falls back to SYNC_TOKEN)
# Authorized Admin emails when accessed via Cloudflare Access Zero Trust
ADMIN_EMAILS = "ruiruiwan8@gmail.com"
