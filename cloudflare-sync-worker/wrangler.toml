name = "don-sync-worker"
main = "src/index.ts"
account_id = "63fb9ee0f754bbe960a080bff02a22fe"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Bucket Binding for sync object blobs & chunks
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "don-sync-bucket"

# Cloudflare D1 Database Binding for selective sync metadata & user permissions
[[d1_databases]]
binding = "DB"
database_name = "don-sync-db"
database_id = "91984417-cc14-4392-a96f-595143698b1c"

[vars]
# Secret token for authentication must be set securely via `wrangler secret put SYNC_TOKEN`
# Optional signing secret for HMAC URL signing must be set securely via `wrangler secret put SIGNING_SECRET`
# Authorized Admin emails when accessed via Cloudflare Access Zero Trust.
# IMPORTANT: rotate this to your own emails and prefer `wrangler secret put ADMIN_EMAILS`
# (leaving the committed default is a known admin-email footgun). No code-level
# default exists, so leaving this unset disables Access-based admin login.
ADMIN_EMAILS = "ruiruiwan8@gmail.com"
# --- Cloudflare Zero Trust Access (passwordless admin login) ---
# To enable Access-based admin login, set BOTH via secrets and put a Cloudflare
# Access application policy in front of the worker's `/api/admin/*` routes
# (configured out-of-band in the Zero Trust dashboard):
#   CF_ACCESS_TEAM_DOMAIN = "https://<your-team>.cloudflareaccess.com"
#   CF_ACCESS_AUD         = "<Application Audience ID (UUID) from the Access app>"
# When unset, the Access/JWT admin path is disabled (fail-closed); the
# master-token (SYNC_TOKEN) and D1-admin token paths are unaffected.
